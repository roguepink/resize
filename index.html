<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140c2a">
<title>写真リサイズ</title>
<meta name="description" content="写真をえらぶだけで、ぐっと小さくします。LINEやメールで送りやすく。写真はスマホの中だけで処理します。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="リサイズ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="写真リサイズ">
<meta property="og:description" content="写真をえらぶだけで、ぐっと小さくします。LINEやメールで送りやすく。写真はスマホの中だけで処理します。">
<meta property="og:image" content="https://roguepink.github.io/resize/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: dark; --ink: #1b1430; --bg: #140c2a; --card: #241449; --yellow: #ffe066; --green: #06c755; --text: #fff; --muted: #c9bfe6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 900; line-height: 1.25; }
  .lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .box { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .label { font-size: 13px; font-weight: 800; color: var(--muted); margin: 0 0 8px; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .chip { flex: 1; font: inherit; font-weight: 800; font-size: 14px; padding: 10px 4px; border: 3px solid var(--ink); border-radius: 999px;
    background: #3a2a66; color: #fff; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; line-height: 1.25; }
  .chip small { display: block; font-weight: 600; font-size: 11px; opacity: .8; }
  .chip.on { background: var(--yellow); color: var(--ink); }
  .big { display: block; width: 100%; font: inherit; font-weight: 900; font-size: 22px; padding: 18px 16px; border: 4px solid var(--ink); border-radius: 999px;
    background: var(--yellow); color: var(--ink); cursor: pointer; text-align: center; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .big.green { background: var(--green); color: #fff; }
  .big.sub { background: #fff; font-size: 18px; padding: 14px; }
  .big:disabled { opacity: .45; cursor: default; }
  .big + .big { margin-top: 10px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #status { min-height: 1.5em; margin: 10px 0 0; font-weight: 800; text-align: center; font-size: 15px; }
  .bar { height: 10px; background: #0e0822; border-radius: 999px; overflow: hidden; margin-top: 10px; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s; }
  #summary { font-size: 20px; font-weight: 900; text-align: center; margin: 0 0 12px; line-height: 1.45; }
  #summary small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .item { background: #0e0822; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; }
  .item img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #000; }
  .item .sz { font-size: 11px; line-height: 1.35; padding: 5px 6px; color: var(--muted); font-weight: 700; }
  .item .sz b { color: #8df0b2; }
  .item a { display: block; font-size: 12px; font-weight: 800; text-align: center; color: var(--ink); background: #fff; padding: 5px; text-decoration: none; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 12px 0 0; }
  .hidden { display: none !important; }
  footer { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<h1>📷 写真リサイズ</h1>
<p class="lead">写真をえらぶだけで、ぐっと小さくします。何枚でもまとめてOK。写真はこのスマホの中だけで処理し、どこにも送りません。</p>

<div class="box" id="pick">
  <p class="label">どのくらい小さくする?</p>
  <div class="chips" id="chips">
    <button type="button" class="chip" data-mode="s">小さめ<small>1枚 約100KB</small></button>
    <button type="button" class="chip on" data-mode="m">ふつう<small>200〜300KB</small></button>
    <button type="button" class="chip" data-mode="l">大きめ<small>約500KB</small></button>
    <button type="button" class="chip" data-mode="xl">約1MB<small>資料・印刷に</small></button>
    <button type="button" class="chip" data-mode="xxl">約2MB<small>きれいに残す</small></button>
    <button type="button" class="chip" data-mode="xxxl">約3MB<small>ほぼ元のまま</small></button>
  </div>
  <p class="hint">「ふつう」は 1枚 200〜300KB。仕事のメールや LINE にちょうどいい重さです。下の段は大きめ(1MB〜)。印刷したり、きれいに残したいときに。元の写真より大きくはなりません。</p>
</div>

<label class="big" for="file" id="btnPick">写真をえらぶ</label>
<input type="file" id="file" accept="image/*" multiple>
<p id="status"></p>
<div class="bar" id="bar"><i></i></div>

<div class="box hidden" id="result">
  <p id="summary"></p>
  <button type="button" class="big green" id="btnShare">LINEなどで送る</button>
  <button type="button" class="big sub" id="btnSave">まとめて保存</button>
  <p class="hint" id="shareHint"></p>
  <div class="grid" id="grid"></div>
  <p class="hint">1枚ずつ: 下の「保存」を押すか、写真を長押しで保存できます。</p>
</div>

<button type="button" class="big sub hidden" id="btnReset">べつの写真をえらぶ</button>
<div class="box hidden" id="installBox">
  <button type="button" class="big sub" id="btnInstall">📲 ホーム画面に入れる(アプリにする)</button>
  <p class="hint" id="installHint">入れると、アイコンから全画面で開けて、電波がなくても使えます。</p>
</div>
<footer>写真の位置情報(どこで撮ったか)も自動で消えます。無料・登録なし。</footer>

<script>
'use strict';
var CONFIG = {
  MODE_KEY: 'resize-mode', DEFAULT_MODE: 'm',
  // できあがりの重さ(バイト)が min〜max に入るように、画質と大きさを自動で調整する
  MODES: {
    s:    { min:  70 * 1024,  max: 130 * 1024,  side: 800,  sideMin: 480,  sideMax: 1200 },
    m:    { min: 200 * 1024,  max: 300 * 1024,  side: 1280, sideMin: 800,  sideMax: 2000 },
    l:    { min: 400 * 1024,  max: 600 * 1024,  side: 1600, sideMin: 1000, sideMax: 2400 },
    xl:   { min: 800 * 1024,  max: 1200 * 1024, side: 2000, sideMin: 1400, sideMax: 3200 },
    xxl:  { min: 1600 * 1024, max: 2400 * 1024, side: 2800, sideMin: 2000, sideMax: 4500 },
    xxxl: { min: 2500 * 1024, max: 3500 * 1024, side: 3500, sideMin: 2600, sideMax: 6000 }
  },
  Q_LO: 0.5, Q_HI: 0.95, Q_START: 0.8
};
var $ = function (id) { return document.getElementById(id); };
var state = { mode: CONFIG.DEFAULT_MODE, items: [], busy: false };
try { var saved = localStorage.getItem(CONFIG.MODE_KEY); if (saved && CONFIG.MODES[saved]) state.mode = saved; } catch (e) {}

/* ---- 大きさの選択 ---- */
var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
function setMode(m) {
  state.mode = m;
  chips.forEach(function (c) { c.classList.toggle('on', c.dataset.mode === m); });
  try { localStorage.setItem(CONFIG.MODE_KEY, m); } catch (e) {}
}
chips.forEach(function (c) { c.addEventListener('click', function () { setMode(c.dataset.mode); c.blur(); }); });
setMode(state.mode);

/* ---- 1枚を小さくする(純粋な部分) ---- */
function fitSize(w, h, maxSide) {            // 長い辺を maxSide 以下にしたときの大きさ(拡大はしない)
  var s = Math.min(1, maxSide / Math.max(w, h));
  return { w: Math.max(1, Math.round(w * s)), h: Math.max(1, Math.round(h * s)), scale: s };
}
function kb(n) { return n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + 'KB' : (n / 1048576).toFixed(1) + 'MB'; }
function outName(name) { return (name || 'photo').replace(/\.[^.]+$/, '') + '_small.jpg'; }

function loadImage(file) {
  return new Promise(function (ok, ng) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); ok(img); };
    img.onerror = function () { URL.revokeObjectURL(url); ng(new Error('この形式は読めません')); };
    img.src = url;
  });
}
function shrink(img, maxSide) {              // 半分ずつ縮めると きれいに仕上がる
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, dst = fitSize(w, h, maxSide);
  var src = img, cw = w, ch = h;
  while (cw / 2 >= dst.w && ch / 2 >= dst.h) {
    var c = document.createElement('canvas'); c.width = Math.round(cw / 2); c.height = Math.round(ch / 2);
    var x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);
    src = c; cw = c.width; ch = c.height;
  }
  var out = document.createElement('canvas'); out.width = dst.w; out.height = dst.h;
  var ctx = out.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, dst.w, dst.h);   // 透明な絵は白地に
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, dst.w, dst.h);
  return out;
}
function toJpeg(canvas, q) {
  return new Promise(function (ok, ng) { canvas.toBlob(function (b) { b ? ok(b) : ng(new Error('変換できません')); }, 'image/jpeg', q); });
}
/* 重さが min〜max に入るまで、画質(q)→ 大きさ(side)の順に調整する。純粋な判断は nextStep() に分けてある */
function nextStep(size, t, side, q) {              // 戻り値: 'ok' / {q} / {side} / 'give-up'
  if (size >= t.min && size <= t.max) return 'ok';
  if (size > t.max) {
    if (q > CONFIG.Q_LO + 0.01) return { q: Math.max(CONFIG.Q_LO, q - Math.max(0.05, (q - CONFIG.Q_LO) / 2)) };
    if (side > t.sideMin + 1) return { side: Math.max(t.sideMin, Math.round(side * 0.85)), q: CONFIG.Q_START };
    return 'give-up';
  }
  if (q < CONFIG.Q_HI - 0.01) return { q: Math.min(CONFIG.Q_HI, q + Math.max(0.03, (CONFIG.Q_HI - q) / 2)) };
  if (side < t.sideMax - 1) return { side: Math.min(t.sideMax, Math.round(side * 1.2)), q: CONFIG.Q_START };
  return 'give-up';
}
async function shrinkFile(file, mode) {
  var t = CONFIG.MODES[mode] || CONFIG.MODES.m;
  var img = await loadImage(file);
  var w = img.naturalWidth, h = img.naturalHeight, longest = Math.max(w, h);
  var side = Math.min(t.side, longest), q = CONFIG.Q_START, canvas = null, blob = null, best = null;
  for (var i = 0; i < 14; i++) {
    if (!canvas || canvas.width !== fitSize(w, h, side).w) { if (canvas) canvas.width = canvas.height = 0; canvas = shrink(img, side); }
    blob = await toJpeg(canvas, q);
    if (!best || Math.abs(blob.size - (t.min + t.max) / 2) < Math.abs(best.size - (t.min + t.max) / 2)) best = blob;
    var step = nextStep(blob.size, t, side, q);
    if (step === 'ok') { best = blob; break; }
    if (step === 'give-up') break;
    if (step.side && step.side >= longest && side >= longest) break;   // 元の写真より大きくはしない
    if (step.side) side = Math.min(step.side, longest);
    q = step.q;
  }
  if (canvas) canvas.width = canvas.height = 0;
  var small = (file.size <= best.size && /^image\/jpe?g$/i.test(file.type) && file.size <= t.max) ? file : best;   // もう十分小さい写真はそのまま
  var out = new File([small], outName(file.name), { type: 'image/jpeg', lastModified: Date.now() });
  return { file: out, before: file.size, after: out.size, w: w, h: h };
}

/* ---- まとめて処理 ---- */
async function processFiles(files) {
  if (!files.length || state.busy) return;
  state.busy = true; clearItems();
  $('btnPick').classList.add('hidden'); $('result').classList.add('hidden'); $('btnReset').classList.add('hidden');
  $('bar').style.display = 'block';
  var failed = 0;
  for (var i = 0; i < files.length; i++) {
    $('status').textContent = (i + 1) + ' / ' + files.length + ' 枚目を小さくしています…';
    $('bar').firstChild.style.width = Math.round(i / files.length * 100) + '%';
    try { state.items.push(await shrinkFile(files[i], state.mode)); } catch (e) { failed++; console.error(files[i].name, e); }
    await new Promise(function (r) { setTimeout(r, 0); });
  }
  $('bar').firstChild.style.width = '100%';
  state.busy = false;
  showResult(failed);
}
function showResult(failed) {
  var items = state.items, before = 0, after = 0;
  items.forEach(function (it) { before += it.before; after += it.after; });
  $('bar').style.display = 'none';
  $('status').textContent = failed ? failed + ' 枚は読めませんでした(写真以外のファイルかも)' : '';
  if (!items.length) { $('btnPick').classList.remove('hidden'); return; }
  $('summary').innerHTML = items.length + '枚 できました<br>' + kb(before) + ' → <span style="color:#8df0b2">' + kb(after) + '</span>' +
    '<small>' + (before > after ? Math.round((1 - after / before) * 100) + '% 小さくなりました' : 'もともと小さい写真でした') + '</small>';
  var grid = $('grid'); grid.innerHTML = '';
  items.forEach(function (it, i) {
    var d = document.createElement('div'); d.className = 'item';
    var img = document.createElement('img'); img.alt = it.file.name; it.url = URL.createObjectURL(it.file); img.src = it.url;
    var sz = document.createElement('div'); sz.className = 'sz'; sz.innerHTML = kb(it.before) + '<br>→ <b>' + kb(it.after) + '</b>';
    var a = document.createElement('a'); a.href = it.url; a.download = it.file.name; a.textContent = '保存';
    d.appendChild(img); d.appendChild(sz); d.appendChild(a); grid.appendChild(d);
  });
  var canShare = !!(navigator.canShare && navigator.canShare({ files: items.map(function (it) { return it.file; }) }));
  $('btnShare').classList.toggle('hidden', !canShare);
  $('shareHint').textContent = canShare ? '「LINEなどで送る」を押すと、送り先を選ぶ画面が出ます。LINE を選ぶと小さくした写真がそのまま送れます。'
    : 'このブラウザでは「送る」ボタンが使えません。「まとめて保存」してから、LINE で写真を選んで送ってください。';
  $('result').classList.remove('hidden'); $('btnReset').classList.remove('hidden');
}
function clearItems() {
  state.items.forEach(function (it) { if (it.url) URL.revokeObjectURL(it.url); });
  state.items = []; $('grid').innerHTML = '';
}

$('file').addEventListener('change', function (ev) {
  var files = Array.prototype.slice.call(ev.target.files || []);
  ev.target.value = '';
  processFiles(files).catch(function (e) { console.error(e); state.busy = false; $('status').textContent = 'うまくいきませんでした。もう一度ためしてください'; $('btnPick').classList.remove('hidden'); });
});
$('btnShare').addEventListener('click', function () {
  this.blur();
  var files = state.items.map(function (it) { return it.file; });
  navigator.share({ files: files, title: '写真' }).catch(function (e) { if (e && e.name !== 'AbortError') { console.error(e); $('status').textContent = '送れませんでした。「まとめて保存」をためしてください'; } });
});
$('btnSave').addEventListener('click', function () {
  this.blur();
  var items = state.items, i = 0;
  (function next() {
    if (i >= items.length) return;
    var a = document.createElement('a'); a.href = items[i].url; a.download = items[i].file.name; document.body.appendChild(a); a.click(); a.remove();
    i++; setTimeout(next, 400);        // 一度に出すと ブラウザが 止めることがあるので 少しずつ
  })();
});
$('btnReset').addEventListener('click', function () {
  this.blur(); clearItems();
  $('result').classList.add('hidden'); $('btnReset').classList.add('hidden'); $('status').textContent = ''; $('btnPick').classList.remove('hidden');
});

/* 確認用: アドレスの末尾に #play(または #demo)をつけると、作った写真3枚で ためしに動かす(スクショ・自動確認で使う) */
if (location.hash === '#play' || location.hash === '#demo') {
  (async function () {
    var files = [];
    var specs = [[4000, 3000, '#e0585b'], [3000, 4000, '#4a90e2'], [2400, 2400, '#39b54a']];
    for (var i = 0; i < specs.length; i++) {
      var c = document.createElement('canvas'); c.width = specs[i][0]; c.height = specs[i][1];
      var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, c.width, c.height);
      g.addColorStop(0, specs[i][2]); g.addColorStop(1, '#fff'); x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
      for (var k = 0; k < 400; k++) { x.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.5) + ')'; x.fillRect(Math.random() * c.width, Math.random() * c.height, 60, 60); }
      x.fillStyle = '#000'; x.font = 'bold 300px sans-serif'; x.fillText('TEST ' + (i + 1), 200, 600);
      var b = await toJpeg(c, 0.95); files.push(new File([b], 'test' + (i + 1) + '.jpg', { type: 'image/jpeg' }));
    }
    window.__demoDone = false;
    await processFiles(files); window.__demoDone = true;
  })().catch(function (e) { console.error(e); });
}

// LINE の中で開いたときだけ、1回だけ案内する(LINE の中は「送る」ボタンが使えないことがあり、ホーム画面にも入れられない)
(function () {
  var seenKey = 'resize-line-tip', seen = false;
  try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) {}
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (!/\bLine\//i.test(navigator.userAgent) || standalone || seen) return;
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:99999;background:#fffaf0;color:#1b1430;border:3px solid #1b1430;border-radius:14px;padding:10px 40px 10px 12px;font:700 13px/1.5 system-ui,sans-serif';
  bar.textContent = 'LINEの中だと「送る」ボタンが使えないことがあります。右下の「…」(または右上の︙)から「ブラウザで開く」を選ぶと、ちゃんと使えて、ホーム画面にも入れられます。';
  var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'とじる'); x.textContent = '×';
  x.style.cssText = 'position:absolute;top:4px;right:6px;width:32px;height:32px;border:0;background:none;font:900 20px/1 system-ui;color:#1b1430;cursor:pointer';
  x.addEventListener('click', function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} bar.remove(); });
  bar.appendChild(x); addEventListener('load', function () { document.body.appendChild(bar); });
})();

// Android の Chrome: ページの中から「ホーム画面に入れる」(入れられる状態になると Chrome が beforeinstallprompt を出す)
(function () {
  var deferred = null, box = $('installBox'), btn = $('btnInstall'), hint = $('installHint');
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) return;
  addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; box.classList.remove('hidden'); });
  btn.addEventListener('click', function () {
    btn.blur();
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function (r) {
      deferred = null;
      if (r && r.outcome === 'accepted') { btn.classList.add('hidden'); hint.textContent = '入れました。ホーム画面か、アプリ一覧(下から上にスワイプ)に「リサイズ」があります。'; }
    }).catch(function () {});
  });
  addEventListener('appinstalled', function () { btn.classList.add('hidden'); hint.textContent = '入れました。ホーム画面か、アプリ一覧(下から上にスワイプ)に「リサイズ」があります。'; box.classList.remove('hidden'); });
  // iPhone の Safari には この仕組みがないので、手順を出す
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) && !/\bLine\//i.test(navigator.userAgent);
  if (ios) { btn.classList.add('hidden'); hint.textContent = 'ホーム画面に入れる: 下の 共有ボタン(四角に↑)→「ホーム画面に追加」。'; box.classList.remove('hidden'); }
})();

// ホーム画面に入れられる(アプリのように開く)ための登録。file:// や 登録できない所では 何もしない
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
